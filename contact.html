<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fr/src/css/style.css">
</head>

<body>
    <header>
        <div class="menu__inner">
            <a href="accueil.html" class="menu__brand">L'effet Matilda</a>

            <input type="checkbox" id="menuBurger" aria-hidden="true">
            <label for="menuBurger" class="menu-btn" aria-label="Ouvrir le menu">
                <span class="menu-btn__bar menu-btn__bar--top"></span>
                <span class="menu-btn__bar"></span>
                <span class="menu-btn__bar menu-btn__bar--bottom"></span>
            </label>

            <nav id="mainNav" class="menu" aria-label="Main navigation">
                <ul class="nav-links">
                    <li><a href="accueil.html">Accueil</a><img src="assets/icones/Home.svg" alt=""></li>
                    <li class="dropdown"><a href="apropos.html">À propos ▾</a>
                        <ul class="submenu">
                            <li><a href="apropos.html">Notre histoire</a></li>
                            <li><a href="contact.html">Contact</a></li>
                        </ul>
                    </li>
                    <li><a href="articles.html">Articles</a><img src="assets/icones/Articles.svg" alt=""></li>
                    <li><a href="glossaire.html">Glossaire</a><img src="assets/icones/Glossaire.svg" alt=""></li>
                </ul>
            </nav>
        </div>
    </header>

    <img class="" src="assets/img/purplecontainer.svg" alt="">
    <a href="contact.html" class="contact-button">Contactez-nous</a>
    <footer>
        <div class="footer-content">
            <p>&copy; 2024 Effet Matilda. Tous droits réservés.</p>
            <h3 class="">L'effet matilda</h3>
            <p class="">MENTIONS LEGALES</p>
            <a href="apropos.html" class="apropos-button">
                <p>A PROPOS</p>
            </a>
            <a href="contact.html" class="contact-button">
                <p>CONTACT</p>
            </a>
            <img class="icones_footer" src="assets/icones_footer/partager.svg" alt="">
            <img class="icones_footer" src="assets/icones_footer/mail_footer.svg" alt="">
            <img class="icones_footer" src="assets/icones_footer/notifications.svg" alt="">

        </div>
    </footer>
    <script>
        (function () {
            // Mobile dropdown toggles
            document.querySelectorAll('.dropdown').forEach(drop => {
                drop.addEventListener('click', (e) => {
                    // allow parent link navigation when not on small screens
                    if (window.matchMedia('(max-width: 900px)').matches) {
                        e.preventDefault();
                        drop.classList.toggle('open');
                    }
                });
            });

            // Close side menu when clicking outside or pressing Escape
            const burger = document.getElementById('menuBurger');
            document.addEventListener('click', (e) => {
                const nav = document.getElementById('mainNav');
                if (!nav) return;
                if (burger && burger.checked && !nav.contains(e.target) && !e.target.closest('label[for="menuBurger"]')) {
                    burger.checked = false;
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (burger) burger.checked = false;
                    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
                }
            });
        })();
    </script>
</body>

</html>
